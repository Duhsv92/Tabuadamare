<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2847"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0096c7"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Moon crescent (representing lunar phase / tides) -->
  <circle cx="48" cy="14" r="8" fill="url(#moon)"/>
  <circle cx="52" cy="11" r="7" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="12" cy="10" r="1.2" fill="#ffd166" opacity="0.8"/>
  <circle cx="24" cy="7" r="0.9" fill="#ffd166" opacity="0.6"/>
  <circle cx="34" cy="12" r="1" fill="#ffd166" opacity="0.7"/>
  <circle cx="18" cy="18" r="0.7" fill="#ffd166" opacity="0.5"/>

  <!-- Wave 1 (front, lighter) -->
  <path d="M0 36 Q8 28 16 36 Q24 44 32 36 Q40 28 48 36 Q56 44 64 36 L64 52 Q56 44 48 52 Q40 60 32 52 Q24 44 16 52 Q8 60 0 52 Z" fill="url(#wave1)" opacity="0.9"/>

  <!-- Wave 2 (back, darker) -->
  <path d="M0 42 Q8 34 16 42 Q24 50 32 42 Q40 34 48 42 Q56 50 64 42 L64 58 Q56 50 48 58 Q40 66 32 58 Q24 50 16 58 Q8 66 0 58 Z" fill="url(#wave2)" opacity="0.7"/>

  <!-- Up/down arrow representing tide levels -->
  <!-- Up arrow -->
  <polygon points="30,22 32,18 34,22" fill="#00b4d8" opacity="0.9"/>
  <rect x="31.2" y="22" width="1.6" height="4" fill="#00b4d8" opacity="0.9" rx="0.5"/>

  <!-- Down arrow -->
  <polygon points="30,33 32,37 34,33" fill="#0077b6" opacity="0.9"/>
  <rect x="31.2" y="29" width="1.6" height="4" fill="#0077b6" opacity="0.9" rx="0.5"/>
</svg>
